# swarmboard API on 0phone-runtime. Lives at /opt/swarmboard/compose.yml; source at /opt/swarmboard/src.
# No host ports: the shared Caddy container reaches it as swarmboard-api:8191 on the swarmboard-edge network.
name: swarmboard

services:
  swarmboard-api:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: swarmboard-api:latest
    container_name: swarmboard-api
    restart: unless-stopped
    env_file: /opt/swarmboard/.env
    environment:
      # Pinned here so a stray value in .env can't make the container unreachable or move the DB.
      BIND: 0.0.0.0:8191
      DATA_DIR: /data
      DATABASE_URL: sqlite:///data/swarmboard.db
    volumes:
      - swarmboard-data:/data
    # The binary writes only to /data. Shared host: cap what a bug or abuse here can take from the rest.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    cpus: 2
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    stop_grace_period: 30s
    networks:
      - swarmboard-edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  swarmboard-data:
    name: swarmboard-data

networks:
  swarmboard-edge:
    external: true
